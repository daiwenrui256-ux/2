name: Deploy Christmas site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Christmas site source
        uses: actions/checkout@v6
        with:
          ref: codex/christmas-particle-tree
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p dist
          cp index.html app.js styles.css dist/
          cp -R assets dist/assets
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
